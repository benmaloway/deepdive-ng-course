<div class="top-menu">
  <img class="logo" src="https://angular-academy.s3.amazonaws.com/main-logo/main-page-logo-small-hat.png">
</div>

<!-- Normally *ngIf syntax used when directly placed in HTML. Because ng-template is talking directly with Angular it doesn't need interpolation so use brackets.  -->
<ng-template [ngIf]="courses[0]" let-course>
  <div class="courses salmon-theme">
      <course-card [highlighted]="true"
      (toggleHighlight)="onToggle($event)"
      #highlighter="hl"
      (courseSelected)="onCourseSelected($event)"
      [course]="course">
      <!-- <ng-template [ngxUnless]="!course.iconUrl"> 
        <course-image [src]="course.iconUrl"></course-image>
      </ng-template> -->
 
      <course-image [src]="course.iconUrl" *ngxUnless="!course.iconUrl"></course-image>

      <div class="course-description" 
        (dblclick)="highlighter.toggle()">
        {{ course.longDescription }}
      </div>
    </course-card>
  </div>
</ng-template>
