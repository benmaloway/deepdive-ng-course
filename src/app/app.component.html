<div class="demo">
  <!-- if not using onPush, change detection on the child component work -->
  <button (click)="onEditCourse()">Edit Course</button>
  <button (click)="onDeleteCourse()">Delete Course</button>
  <button (click)="onChangeCourse()">Change Course</button>
</div>


<div class="courses" *ngIf="courses[0] as course" >

  <course-card
    (courseChanged)="save($event)"
    type="test-attribute"
    [course]="course">
    <course-image [src]="course.iconUrl"></course-image>
  </course-card>

</div>
