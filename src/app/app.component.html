<div class="top-menu">

  <img class="logo"
    src="https://angular-academy.s3.amazonaws.com/main-logo/main-page-logo-small-hat.png">
  </div>

  
<div>

<div class="demo">

  <button (click)="onEditCourse()" i18n>Edit Course</button>

  <!-- Original ICU plural syntax kept for reference: it is brittle in this Angular 22 setup and may disappear at runtime. -->
  <div i18n>
    { coursesTotal, plural,
    =0 {No courses are available.}
    =1 {One course is available.}
    other {A total of {{coursesTotal}} courses are available.}
  }
  </div>
  <!-- this would be the non ICU syntax, perhaps more robust -->
  <!-- div [ngPlural]="coursesTotal">
    <ng-template ngPluralCase="=0" i18n>No courses are available.</ng-template>
    <ng-template ngPluralCase="=1" i18n>One course is available.</ng-template>
    <ng-template ngPluralCase="other" i18n>A total of {{ coursesTotal }} courses are available.</ng-template>
  </div> -->

</div>

<div class="courses" *ngFor="let course of courses " >

  <course-card
    (courseChanged)="save($event)"
    type="test-attribute"
    [course]="course">
    <course-image [src]="course.iconUrl"></course-image>
  </course-card>

</div>
