  <div class="course-card" *ngIf="course" #container>

    <div class="course-title">
      {{ cardIndex || '' + ' '}}  {{ course.description }}
    </div>
    <!-- Example of content projection using ng-content. The select attribute allows you to specify which elements to project into the component. In this case, it will project any element with the attribute courseImage into the component. -->
    <ng-content></ng-content>
    <!-- To target a particular element in the projected content, you can use the select attribute on the ng-content element. For example, if you want to project only elements with the attribute courseImage, you can use <ng-content select="[courseImage]"></ng-content>. This will only project elements that have the courseImage attribute into the component. -->
    <ng-content select="[courseImage]"></ng-content>
    <!-- Target a parent div of the img -->
    <ng-content select=".course-image"></ng-content>
    <!-- Anything else in parent component not specifically projected into child component -->
    <ng-content></ng-content>

    <div class="course-description">
      {{ course.longDescription }}
    </div>

    <div class="course-category" [ngSwitch]="course.category">
      <div class="category" *ngSwitchCase="'BEGINNER'" >Beginner</div>
      <div class="category" *ngSwitchCase="'INTERMEDIATE'" >Intermediate</div>
      <div class="category" *ngSwitchCase="'ADVANCED'" >Advanced</div>
      <div class="category" *ngSwitchDefault>All Levels</div>
    </div>
    
    <button (click)="onCourseViewed()">View Course</button>

  </div>
